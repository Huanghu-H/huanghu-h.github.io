<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>huanghusxt.top · 测试首页</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        line-height: 1.6;
        color: #182d2a;
        background: #f2f8f4;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(34rem, calc(100% - 2rem));
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid #b4d0c5;
        border-radius: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.75rem);
        line-height: 1.2;
      }

      p {
        margin: 1rem 0 0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: #ecf6f1;
          background: #142622;
        }

        main {
          border-color: #527568;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>huanghusxt.top</h1>
      <p>这是 GitHub Pages 的测试首页。你能看到这段文字，说明页面已成功发布。</p>
    </main>
  </body>
</html>
